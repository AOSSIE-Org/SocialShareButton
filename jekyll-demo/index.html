<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jekyll Demo - SocialShareButton</title>
    <!-- SocialShareButton CSS (Branch CDN) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/amankv1234/SocialShareButton@feature/hugo-jekyll-demo-cdn-guide/src/social-share-button.css"
    />
    <style>
      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        padding: 0;
        margin: 0;
        background: #fff;
        color: #333;
      }
      .wrapper {
        max-width: 800px;
        margin: 0 auto;
        padding: 4rem 2rem;
      }
      header {
        border-bottom: 1px solid #e8e8e8;
        padding: 1rem 0;
      }
      .site-title {
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: -1px;
        text-decoration: none;
        color: #424242;
      }
      h1 {
        font-size: 2.2rem;
        letter-spacing: -1px;
        line-height: 1;
      }
      .post-content {
        font-size: 1.2rem;
        line-height: 1.5;
        color: #424242;
        margin-top: 2rem;
      }
      .share-box {
        background: #f9f9f9;
        padding: 2rem;
        border-radius: 4px;
        margin-top: 3rem;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <a href="#" class="site-title">My Jekyll Blog</a>
      </header>

      <main>
        <h1>Seamless Jekyll Integration</h1>

        <div class="post-content">
          <p>
            Jekyll is the engine behind GitHub Pages. This demo shows how to drop SocialShareButton
            into a Jekyll layout file to enable sharing across all your posts automatically.
          </p>
        </div>

        <div class="share-box">
          <p style="margin-top: 0">Share this post:</p>
          <!-- SocialShareButton Container -->
          <div id="share-button"></div>
        </div>
      </main>
    </div>

    <!-- SocialShareButton JS (Branch CDN) -->
    <script
      src="https://cdn.jsdelivr.net/gh/amankv1234/SocialShareButton@feature/hugo-jekyll-demo-cdn-guide/src/social-share-button.js"
      defer
    ></script>

    <!-- Initialization -->
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        new SocialShareButton({
          container: "#share-button",
          url: window.location.href,
          title: document.title,
          description: "Check out this Jekyll integration!",
          theme: "light",
          buttonStyle: "compact",
        });
      });
    </script>
  </body>
</html>
